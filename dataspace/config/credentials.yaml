# API keys the MCP connector uses when it calls a source, keyed by catalog dataset id.
# Never put a key in this file: write ${ENV_VAR} and set the variable in .env (not committed).
#
# Fields per dataset:
#   api_key  (required)  the key, normally ${SOME_VAR}
#   in       (optional)  header | query; default: taken from the source's OpenAPI securitySchemes
#   name     (optional)  header or query parameter name; default: from the OpenAPI
#   prefix   (optional)  text before the key, e.g. "Api-Key " or "Bearer "
#
# Edits take effect on the next tool call; no restart needed.

# Acceslibre's OpenAPI declares no securitySchemes, so the location is given here.
acceslibre:
  api_key: ${ACCESLIBRE_API_KEY}
  in: header
  name: Authorization
  prefix: "Api-Key "
