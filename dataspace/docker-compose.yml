name: accessibility-dataspace

services:
  catalog:
    build: ./catalog
    restart: unless-stopped  # come back after a reboot
    ports: ["${CATALOG_BIND:-127.0.0.1}:8001:8000"]  # 0.0.0.0 publishes it, including write endpoints
    environment:
      CATALOG_BASE_URL: ${CATALOG_BASE_URL:-http://localhost:8001}
    volumes:
      - catalog-data:/data

  vochub-vectors:
    image: qdrant/qdrant:v1.20.0
    restart: unless-stopped  # come back after a reboot
    volumes: [vochub-vectors:/qdrant/storage]

  vochub:
    build: ./vochub
    restart: unless-stopped  # come back after a reboot
    ports: ["${VOCHUB_BIND:-127.0.0.1}:8002:8000"]   # keep private: ingestion has no authentication
    environment:
      QDRANT_URL: http://vochub-vectors:6333
      CONTEXT_FILE: /data/context.md
    volumes: [vochub-data:/data]
    depends_on: [vochub-vectors]

  connector:
    build: ./connector
    restart: unless-stopped  # come back after a reboot
    ports: ["${CONNECTOR_BIND:-127.0.0.1}:8800:8800"]  # the MCP endpoint agents connect to
    env_file: [{ path: .env, required: false }]
    environment:
      # Defaults: catalog and vochub in this Compose project. Override in .env to use remote ones (make up-connector).
      CATALOG_URL: ${CATALOG_URL:-http://catalog:8000}
      VOCHUB_URL: ${VOCHUB_URL:-http://vochub:8000}
      SOURCE_URL_MAP: ${SOURCE_URL_MAP:-}
      CREDENTIALS_FILE: /config/credentials.yaml
      CALL_LOG: ${CALL_LOG:-0}  # 1: one JSON line per tool call (make calls); holds the users' questions
    extra_hosts: ["host.docker.internal:host-gateway"]  # reach SSH tunnels on the host (Linux; built in on Docker Desktop)
    volumes:
      - ./config:/config:ro
    depends_on:
      catalog: { condition: service_healthy }
      vochub: { condition: service_healthy }

volumes:
  catalog-data:
  vochub-vectors:
  vochub-data:
