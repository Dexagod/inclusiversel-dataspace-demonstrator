# Datasets on Opendatasoft portals that the connector queries live, with no proxy.
# `make registrations` (in this folder) turns each entry into <id>/registration.json from the portal's own metadata;
# `hint` is added to the description; other keys (except portal, dataset_id, catalog) override generated fields.
- id: tourisme-handicap
  assessment:
    methods: [certified]
    note: "Every record holds the French state label Tourisme & Handicap; droit_d_utilisation_du_label 'actif' means the label is currently valid. handicap_moteur, handicap_visuel, handicap_auditif and handicap_mental say which disability families the label covers."
  records: {"at": ["results"], "name": ["nom_du_professionnel"], "url": ["https://data.economie.gouv.fr/explore/dataset/etablissements-labellises-tourisme-et-handicap/table/?q=\"{nom_du_professionnel}\""], "website": ["site_web"], "basis": [{"field": "droit_d_utilisation_du_label", "equals": "actif", "method": "certified", "by": "Tourisme & Handicap (French state label)", "label": "Tourisme & Handicap: {handicaps_attribues}"}], "default": {"method": "unknown", "note": "the Tourisme & Handicap label is not active"}}
  portal: data.economie.gouv.fr
  dataset_id: etablissements-labellises-tourisme-et-handicap
  hint: "Towns in ville are in capitals: filter with ville=\"LILLE\" (search(\"Lille\") also finds Lillebonne). activite gives the kind of place: Hôtel, Hôtel-restaurant, Restauration, \"Café, bar, brasserie\", Lieu de visite, Office de tourisme and others. Each record's url opens it in the official label list; site_web is the place's own website."
  catalog: france
  spatial: [France]
  keywords: [Tourisme et Handicap, label, accessibilité, handicap moteur, handicap visuel, handicap auditif, handicap mental]
  licence_note: No licence is stated on data.economie.gouv.fr; the 2020 version of this dataset was under Licence Ouverte 2.0.

- id: liege-pmr-toilets
  assessment:
    methods: [official]
    note: "List of accessible public toilets published by the city."
  portal: www.odwb.be
  dataset_id: toilettes-pmr
  catalog: belgium
  spatial: [Liège, Wallonia, Belgium]

- id: sncf-lift-status
  assessment:
    methods: [official]
    note: "Live operating status of lifts, published by SNCF, the operator."
  portal: ressources.data.sncf.com
  dataset_id: etat-fonctionnement-elevatique-gare
  catalog: france-mobility
  spatial: [France]
  update_frequency: CONT
  keywords: [ascenseur, escalator, gare, PMR, état de fonctionnement]
  hint: Station names are not in this dataset; gareid is the id of the station in dataset sncf-stations (gares-de-voyageurs).

- id: sncf-stations
  assessment:
    methods: [official]
    note: "Station reference list published by SNCF, the operator."
  portal: ressources.data.sncf.com
  dataset_id: gares-de-voyageurs
  catalog: france-mobility
  spatial: [France]
  keywords: [gare, gares de voyageurs, référentiel, UIC]
  hint: Reference list of passenger stations; its id is the gareid used in sncf-lift-status.

- id: sncf-station-equipment
  assessment:
    methods: [official]
    note: "Published by SNCF, the operator."
  portal: ressources.data.sncf.com
  dataset_id: equipements-accessibilite-en-gare
  catalog: france-mobility
  spatial: [France]
  keywords: [gare, accessibilité, PMR, équipements]

- id: sncf-assistance
  assessment:
    methods: [official]
    note: "Published by SNCF, the operator; datestatut is the date of the status."
  portal: ressources.data.sncf.com
  dataset_id: assistance-psh-pmr
  catalog: france-mobility
  spatial: [France]
  keywords: [gare, assistance, PMR, handicap, Accès Plus]

