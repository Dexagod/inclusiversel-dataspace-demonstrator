# --- Literature study: data standards and schemas ---
- url: https://schema.data.gouv.fr/MTES-MCT/acceslibre-erp-base/
  title: Acceslibre ERP base schema
  summary: "The schema.data.gouv.fr schema for the accessibility of buildings open to the public (ERP) in its base form, the starting point of the Acceslibre data model."
  language: fr
  tags: [acceslibre, schema]
- url: https://sozialhelden.github.io/a11yjson/
  title: A11yJSON accessibility data standard
  summary: "A11yJSON, an open standard based on GeoJSON for exchanging accessibility information about places, amenities such as elevators and escalators, sanitary facilities, media and policies."
  language: en
  tags: [a11yjson, schema]
- url: https://wiki.openstreetmap.org/wiki/Disabilities
  title: OpenStreetMap accessibility tagging (Disabilities)
  summary: "OpenStreetMap's tags for disabled users: wheelchair=yes/limited/no, ramps, tactile paving, tactile maps, acoustic traffic signals, wheelchair toilets and related tags."
  language: en
  tags: [openstreetmap, schema, tagging]
# gtfs.org refuses automated requests (403); the same pages come from its GitHub repository as Markdown.
- url: https://raw.githubusercontent.com/MobilityData/gtfs.org/main/docs/en/documentation/schedule/examples/pathways.md
  title: GTFS pathways and physical accessibility
  summary: "Worked example of GTFS pathways: how a transit feed describes a station in detail (entrances, levels, corridors, stairs, elevators, escalators) so trip planners can offer step-free routes."
  language: en
  tags: [gtfs, transport, schema]
