- url: https://acceslibre.beta.gouv.fr/contrib/documentation/
  title: Acceslibre field documentation
  summary: "Acceslibre's documentation of every accessibility field it records for French buildings open to the public (ERP): transport, parking, outside path, entrance, reception, toilets and rooms, with per field its meaning, data type and allowed values."
  language: fr
  tags: [acceslibre, criteria]
- url: https://schema.data.gouv.fr/MTES-MCT/acceslibre-schema/latest.html
  title: Acceslibre data schema
  summary: "The French public data schema (schema.data.gouv.fr) for accessibility information about buildings open to the public (ERP), used by Acceslibre: the field names, types and allowed values for exchanging this data."
  language: fr
  tags: [acceslibre, schema]
- url: https://www.vlaanderen.be/inter/overheden-en-professionelen/iedereenoveral
  title: IedereenOveral for governments and professionals
  summary: "Inter's background page on IedereenOveral, the platform for accessibility information across Flanders: what it is used for, the categories and types of locations on it, and for which types anyone can add information."
  language: nl
  tags: [iedereenoveral]
- url: https://access-i.be/en/?p=1453
  title: "Access-i: what it is and how places are audited"
  summary: "Access-i in Wallonia and Brussels: places are audited on site, and each gets an information sheet on access-i.be listing its strengths and points of attention per type of disability."
  language: en
  tags: [access-i, criteria, licence-restricted]
- url: https://limoges.fr/sites/default/files/espace_presse/2025/CP%20Picto%20Access%2003%202025-1.pdf
  title: Picto Access pictogram scheme (Limoges press release)
  summary: "Press release of the City of Limoges on Picto Access, a French scheme that rates public buildings with a pictogram per type of disability in three levels: green A (accessible on one's own), yellow B (with some help), red C (not accessible)."
  language: fr
  tags: [pictoaccess, criteria]

