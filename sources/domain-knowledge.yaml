  title: Handy.brussels / AMT Concept pictograms
  summary: "The pictograms of Handy.brussels / AMT Concept in Brussels: accessibility types (Type I is fully accessible) and icons for parking, mobility impaired pedestrians, blind and visually impaired, deaf and hearing impaired, mental disability and adapted toilets."
