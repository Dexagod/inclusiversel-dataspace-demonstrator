  title: NeTEx accessibility white paper
  summary: "CEN white paper (2015) on how NeTEx, the European standard for public transport data, describes accessibility: accessibility assessments and limitations of stops, stop places, paths and vehicles, equipment and passenger needs."
  language: en
  tags: [netex, transport, schema]
- url: https://raw.githubusercontent.com/MobilityData/gtfs.org/main/docs/en/getting-started/features/accessibility.md
  title: GTFS accessibility features (wheelchair boarding, accessible trips, text-to-speech)
  summary: "How GTFS describes accessibility: wheelchair_boarding on stops (stations, entrances and boarding areas), wheelchair_accessible on trips, and text-to-speech names for stops, with sample data."
  language: en
  tags: [gtfs, transport, schema]
- url: https://raw.githubusercontent.com/MobilityData/gtfs.org/main/docs/en/getting-started/features/pathways.md
  title: GTFS pathways and levels (stations, step-free routes)
  summary: "GTFS pathways.txt and levels.txt: how a feed describes the inside of a station as connected pathways (walkways, stairs, escalators, elevators), with pathway details, levels, traversal times and signs, so trip planners can find step-free routes."
  language: en
  tags: [gtfs, transport, schema]
- url: https://normes.transport.data.gouv.fr/normes/netex/accessibilite/
  title: Profil NeTEx accessibilité France (French NeTEx accessibility profile)
  summary: "The French national NeTEx profile for public transport accessibility (version 2.4): the minimum required by French and European rules, how a place meets each user need, available services, equipment (access, waiting, signs, ticketing, parking) and paths."
  language: fr
  tags: [netex, transport, schema, france]
- url: https://www.ecologie.gouv.fr/politiques-publiques/donnees-daccessibilite-acceslibre-mobilites
  title: Données d'accessibilité et Acceslibre Mobilités (French transport accessibility data policy)
  summary: "The French ministry's page on accessibility data for transport and roads: the duty since the 2019 mobility law (LOM) to collect and publish it, the NeTEx accessibility profile, the CNIG standard for roads and its links with OpenStreetMap, and Acceslibre Mobilités as a collection tool."
  language: fr
  tags: [netex, transport, legislation, acceslibre, france]
- url: https://www.ecologie.gouv.fr/sites/default/files/documents/2025%2006%20Schema%20Politiques%20des%20donn%C3%A9es%20accessibilit%C3%A9_0.pdf
  title: Schéma des politiques des données d'accessibilité (France, 2025)
  summary: "One-page diagram (June 2025) of the French accessibility data ecosystem: the CNIG standard and the NeTEx accessibility profile as exchange format, the joint order of 28 May 2024, the national access point (PAN), the legal right to travel information, and who maintains each part."
  language: fr
  tags: [netex, transport, legislation, france]
- url: https://publicaties.vlaanderen.be/view-file/69606
