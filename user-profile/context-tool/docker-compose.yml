name: accessibility-profile-context
services:
  profile:
    build: .
    restart: unless-stopped  # come back after a reboot, like the data space and the viewer
    ports:
      - "${PROFILE_BIND:-127.0.0.1}:8095:8095"
    environment:
      # Link to the viewer in the sidebar. Empty: /viewer/ behind the reverse proxy, http://localhost:8090/ otherwise.
      VIEWER_URL: ${PROFILE_VIEWER_URL:-}
    volumes:
      - ../../viewer/static:/app/viewer-static:ro
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
