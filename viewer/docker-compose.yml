name: accessibility-dataspace-viewer
services:
  viewer:
    build: .
    restart: unless-stopped  # come back after a reboot, like the data space
    ports:
      - "127.0.0.1:8090:8090"
    environment:
      CATALOG_URL: http://catalog:8000
      VOCHUB_URL: http://vochub:8000
      CONNECTOR_URL: http://connector:8800
    networks:
      - dataspace
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
networks:
  dataspace:
    external: true
    name: accessibility-dataspace_default
