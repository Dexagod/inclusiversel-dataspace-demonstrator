name: accessibility-dataspace-viewer
services:
  viewer:
    build: .
    ports:
      - "127.0.0.1:8090:8090"
    environment:
      CATALOG_URL: http://catalog:8000
      VOCHUB_URL: http://vochub:8000
    networks:
      - dataspace
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
networks:
  dataspace:
    external: true
    name: accessibility-dataspace_default
